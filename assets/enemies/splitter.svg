    </filter>
  </defs>
  <g filter="url(#glow)">
    <circle cx="24" cy="24" r="14" fill="currentColor" opacity="0.4"/>
    <circle cx="24" cy="24" r="11" fill="currentColor" opacity="0.85"/>
    <circle cx="18" cy="20" r="5" fill="currentColor" opacity="0.6"/>
    <circle cx="30" cy="20" r="5" fill="currentColor" opacity="0.6"/>
    <circle cx="18" cy="20" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="30" cy="20" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="24" cy="30" r="4" fill="#fff" opacity="0.7"/>
    <line x1="24" y1="24" x2="24" y2="30" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
