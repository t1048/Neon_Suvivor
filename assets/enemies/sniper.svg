<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="8" y="18" width="24" height="16" rx="3" fill="currentColor" opacity="0.85"/>
    <rect x="32" y="22" width="14" height="6" rx="1" fill="currentColor"/>
    <circle cx="46" cy="25" r="2" fill="currentColor"/>
    <circle cx="20" cy="26" r="5" fill="currentColor" opacity="0.6"/>
    <circle cx="20" cy="26" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="20" cy="26" r="1.5" fill="currentColor"/>
    <rect x="10" y="12" width="16" height="6" rx="3" fill="currentColor" opacity="0.7"/>
    <rect x="12" y="34" width="5" height="8" rx="2" fill="currentColor" opacity="0.6"/>
    <rect x="22" y="34" width="5" height="8" rx="2" fill="currentColor" opacity="0.6"/>
  </g>
</svg>
