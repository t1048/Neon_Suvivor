<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="12" y="12" width="24" height="24" rx="3" fill="currentColor" opacity="0.85"/>
    <rect x="16" y="16" width="16" height="16" rx="2" fill="currentColor"/>
    <circle cx="24" cy="24" r="4" fill="#fff" opacity="0.9"/>
    <line x1="24" y1="12" x2="24" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="24" cy="5" r="2" fill="currentColor"/>
    <rect x="14" y="36" width="4" height="6" rx="1" fill="currentColor" opacity="0.6"/>
    <rect x="30" y="36" width="4" height="6" rx="1" fill="currentColor" opacity="0.6"/>
  </g>
</svg>
