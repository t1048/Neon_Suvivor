    <circle cx="21" cy="26" r="7" fill="currentColor" opacity="0.6"/>
    <circle cx="21" cy="26" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="21" cy="26" r="2" fill="currentColor"/>
    <rect x="12" y="36" width="6" height="8" rx="2" fill="currentColor" opacity="0.6"/>
    <rect x="24" y="36" width="6" height="8" rx="2" fill="currentColor" opacity="0.6"/>
